name: Publish plugin store

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml, 'dist/**']

permissions:
  contents: write

concurrency:
  group: publish-latest-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish versioned release and refresh the compatibility download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd release-assets
          for asset in store.json local.smart-shuffle.json local.smart-shuffle.mjs local.smart-shuffle.mjs.map tidaluna-prettier.json tidaluna-prettier.mjs; do
            gh api "repos/$GH_REPO/contents/dist/$asset?ref=$RELEASE_COMMIT" --jq '.content' | base64 --decode > "$asset"
            test -s "$asset"
          done
          version=$(python3 -c 'import json; print(json.load(open("local.smart-shuffle.json"))["version"])')
          python3 -c 'import json; s=json.load(open("store.json")); assert s["plugins"] == ["local.smart-shuffle.mjs", "tidaluna-prettier.mjs"]; json.load(open("local.smart-shuffle.json"))'
          cat > notes.md <<'NOTES'
          This store also includes Tidaluna Prettier 1.0.0: collapsible plugin cards, developer avatars, search and status filters.
          Prettier validation: four DOM tests and build passed; live TIDAL verification pending.

          Smart Shuffle adds music recommendations across all supported music sources.

          - Queue-based recommendations combine up to five track radios with deterministic ranking.
          - Choose Queue or Current track as the recommendation source.
          - Suggest now works while paused and with automatic recommendations disabled.
          - Recommend after every 1–20 regular tracks (default: 3).
          - Count tracks on playback start or after 30 seconds of actual playback.
          - English controls, progress status, and safe handling of pending recommendations.

          Install through Luna Settings > Plugin Store > Install from URL:
          https://github.com/Duffed/tidaluna-smart-shuffle/releases/download/latest/store.json

          Starts disabled. Enable it in the plugin settings or player.

          Validation: 46 automated tests, TypeScript check and build passed. Desktop checks covered both buttons, paused insertion, natural track transitions, the 30-second counter, and plugin reload. Compact layout and comparative listening remain unverified; see VALIDATION.md.
          NOTES
          assets=(store.json local.smart-shuffle.json local.smart-shuffle.mjs local.smart-shuffle.mjs.map tidaluna-prettier.json tidaluna-prettier.mjs)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Version $version already exists; keeping versioned assets unchanged."
          else
            gh release create "$tag" "${assets[@]}" \
            --target "$RELEASE_COMMIT" --title "Smart Shuffle $version" --notes-file notes.md --latest
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${assets[@]}" --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$RELEASE_COMMIT" -F force=true
            gh release edit latest --title "Smart Shuffle $version (rolling download)" --notes-file notes.md --latest=false
          else
            gh release create latest "${assets[@]}" \
              --target "$RELEASE_COMMIT" --title "Smart Shuffle $version (rolling download)" --notes-file notes.md --latest=false
          fi
